name: Windows device and updater acceptance

on:
  push:
    branches: [main, 'fix/**']
    paths:
      - '.github/workflows/device-windows-smoke.yml'
      - 'packages/device/**'
      - 'packages/shared/**'
      - 'scripts/*windows*'
      - 'scripts/build-device.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
  pull_request:
    paths:
      - '.github/workflows/device-windows-smoke.yml'
      - 'packages/device/**'
      - 'packages/shared/**'
      - 'scripts/*windows*'
      - 'scripts/build-device.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Optional published client URL; otherwise test the checked-out source
        required: false
      bundle_sha256:
        description: Required SHA-256 when bundle_url is provided
        required: false
      harness_url:
        description: Optional published shell harness URL; otherwise build from source
        required: false
      harness_sha256:
        description: Required SHA-256 when harness_url is provided
        required: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    env:
      RELAY_BUNDLE_URL: ${{ inputs.bundle_url }}
      RELAY_BUNDLE_SHA: ${{ inputs.bundle_sha256 }}
      RELAY_HARNESS_URL: ${{ inputs.harness_url }}
      RELAY_HARNESS_SHA: ${{ inputs.harness_sha256 }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked build and test dependencies
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse and test Windows installer in the selected PowerShell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @('scripts/test-windows-bundle.ps1','scripts/install-windows.ps1','scripts/test-windows-installer.ps1','packages/device/test/manual/windows-workspace-observe.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $relative), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
            Write-Output ('Parsed ' + $relative + ' with ' + $PSVersionTable.PSVersion)
          }
          $LASTEXITCODE = 0
          & ./scripts/test-windows-installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $powerShellName = if ($PSVersionTable.PSEdition -eq 'Core') { 'pwsh.exe' } else { 'powershell.exe' }
          ('MCP_RELAY_POWERSHELL=' + (Join-Path $PSHOME $powerShellName)) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test updater state transitions, reloads and Windows environment
        run: |
          npm.cmd exec --no -- vitest run packages/device/test/updater.test.ts packages/device/test/updater-reload.test.ts packages/device/test/windows-shell.test.ts packages/device/test/windows-workspace.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone client and native acceptance harnesses from this commit
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'relay-native-smoke'
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          npm.cmd run build --workspace @mcp-relay/shared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-device.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item packages/device/dist/cli.cjs (Join-Path $artifactDir 'cli.cjs')
          npm.cmd exec --no -- esbuild packages/device/test/manual/windows-bundle-smoke.ts --bundle --platform=node --format=cjs --target=node22 ("--outfile=" + (Join-Path $artifactDir 'windows-bundle-smoke.cjs'))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-windows-updater-tests.mjs (Join-Path $artifactDir 'windows-updater-smoke.cjs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile the owned isolated-session validation fixture
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'relay-native-smoke'
          $compiler = Join-Path ([Environment]::GetFolderPath('Windows')) 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $source = Join-Path $env:GITHUB_WORKSPACE 'packages/device/test/manual/windows-workspace-fixture.cs'
          $output = Join-Path $artifactDir 'windows-workspace-fixture.exe'
          & $compiler /nologo /target:winexe /optimize+ ("/out:" + $output) /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Workspace fixture was not compiled' }
          @{ compiled = $true; sourceSha256 = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant(); executableSha256 = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant(); nativeSignInTested = $false } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $artifactDir 'windows-workspace-fixture-build.json')
      - name: Verify optional explicitly selected published artifacts
        if: inputs.bundle_url != '' || inputs.bundle_sha256 != '' || inputs.harness_url != '' || inputs.harness_sha256 != ''
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'relay-native-smoke'
          $env:RELAY_ARTIFACT_DIR = $artifactDir
          @'
          const { writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          const { createHash } = require("node:crypto");
          async function download(url, expected, name) {
            if (!url && !expected) return;
            if (!url || !expected) throw new Error("artifact URL and SHA-256 must be supplied together");
            const parsed = new URL(url);
            if (parsed.origin !== "https://relay.cyjin.dev" || !parsed.pathname.startsWith("/updates/device/")) throw new Error("unexpected artifact origin");
            if (!/^[a-f0-9]{64}$/.test(expected)) throw new Error("invalid expected digest");
            const response = await fetch(parsed, { redirect: "error", signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error("artifact HTTP " + response.status);
            const bytes = Buffer.from(await response.arrayBuffer());
            if (bytes.length > 32 * 1024 * 1024) throw new Error("artifact too large");
            const sha256 = createHash("sha256").update(bytes).digest("hex");
            if (sha256 !== expected) throw new Error("artifact digest mismatch: " + name);
            writeFileSync(join(process.env.RELAY_ARTIFACT_DIR, name), bytes);
            console.log(JSON.stringify({name, sha256, bytes: bytes.length, node: process.version}));
          }
          (async () => {
            await download(process.env.RELAY_BUNDLE_URL, process.env.RELAY_BUNDLE_SHA, "cli.cjs");
            await download(process.env.RELAY_HARNESS_URL, process.env.RELAY_HARNESS_SHA, "windows-bundle-smoke.cjs");
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          '@ | Set-Content -Encoding utf8 (Join-Path $artifactDir 'download.cjs')
          node (Join-Path $artifactDir 'download.cjs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native launcher, supervisor and worker OTA acceptance
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $artifactDir = Join-Path $env:RUNNER_TEMP 'relay-native-smoke'
          $report = Join-Path $artifactDir 'windows-updater.tap'
          node --test --test-reporter=tap (Join-Path $artifactDir 'windows-updater-smoke.cjs') *> $report
          $nativeExit = $LASTEXITCODE
          Get-Content $report
          $evidenceDir = Join-Path $artifactDir 'ota-evidence'
          New-Item -ItemType Directory -Force $evidenceDir | Out-Null
          Get-Content $report | Where-Object { $_ -match '^# evidence: ' } | ForEach-Object {
            $evidencePath = $_ -replace '^# evidence: ', ''
            if (Test-Path -LiteralPath $evidencePath) { Copy-Item -LiteralPath $evidencePath -Destination $evidenceDir -Recurse }
          }
          if ($nativeExit -ne 0) { exit $nativeExit }
      - name: Run real Windows shell, cancellation and lock acceptance
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $artifactDir = Join-Path $env:RUNNER_TEMP 'relay-native-smoke'
          $report = Join-Path $artifactDir 'windows-smoke.json'
          $stderr = Join-Path $artifactDir 'windows-smoke.stderr.log'
          node (Join-Path $artifactDir 'windows-bundle-smoke.cjs') (Join-Path $artifactDir 'cli.cjs') 1> $report 2> $stderr
          $nativeExit = $LASTEXITCODE
          Get-Content $report
          if ($nativeExit -ne 0) { Get-Content $stderr; exit $nativeExit }
          $result = Get-Content -Raw $report | ConvertFrom-Json
          if (-not $result.passed) { throw 'Native acceptance did not pass' }
          Copy-Item (Join-Path $result.evidence 'acceptance.json') (Join-Path $artifactDir 'acceptance.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-native-relay-acceptance-${{ matrix.shell }}
          path: |
            ${{ runner.temp }}/relay-native-smoke/windows-smoke.json
            ${{ runner.temp }}/relay-native-smoke/windows-smoke.stderr.log
            ${{ runner.temp }}/relay-native-smoke/acceptance.json
            ${{ runner.temp }}/relay-native-smoke/windows-updater.tap
            ${{ runner.temp }}/relay-native-smoke/windows-workspace-fixture-build.json
            ${{ runner.temp }}/relay-native-smoke/ota-evidence/**/*.json*
            ${{ runner.temp }}/relay-native-smoke/ota-evidence/**/*.log
          if-no-files-found: warn
